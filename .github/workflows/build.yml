name: Build WewPagram

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 350

    steps:
      - name: Checkout mod patch (this repo)
        uses: actions/checkout@v4
        with:
          path: wewpagram-mod-source

      - name: Checkout upstream Telegram-iOS (with real submodules)
        run: |
          set -x
          git clone --recursive -j8 https://github.com/TelegramMessenger/Telegram-iOS.git upstream

      - name: Ensure submodules are initialized
        run: |
          set -x
          cd upstream
          git submodule sync --recursive
          git submodule update --init --recursive --jobs 8
          git submodule status --recursive

      - name: Apply WewPagram mod files
        run: |
          set -x
          # Копируем мод в upstream, НЕ удаляя существующие файлы upstream (убрали --delete)
          rsync -a --exclude='.git' wewpagram-mod-source/wewpagram-mod/ upstream/
          mkdir -p upstream/wewpagram-config
          cp wewpagram-mod-source/wewpagram-config/appstore-configuration.json upstream/wewpagram-config/

      - name: Show disk space
        run: df -h /

      - name: Select Xcode
        run: |
          set -x
          ls /Applications | grep -i xcode || true
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Import fake-codesigning certificates (if present)
        run: |
          set -x
          cd upstream
          if [ -f build-system/Make/ImportCertificates.py ]; then
            python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          else
            echo "NOTICE: build-system/Make/ImportCertificates.py not found — skipping certificate import."
            echo "If certificates are required, ensure upstream's script exists and wasn't overwritten by the mod."
          fi

      - name: Build WewPagram
        run: |
          set -x
          set -o pipefail
          cd upstream
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_wewpagram"
          BUILD_NUMBER="$(git -C . rev-list --count HEAD 2>/dev/null || echo 100001)"

          python3 -u build-system/Make/Make.py \
            --overrideXcodeVersion \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            build \
            --configurationPath="wewpagram-config/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

      - name: Collect artifacts
        run: |
          set -x
          cd upstream
          mkdir -p build/artifacts
          IPA_PATH=$(find bazel-out -type f -name 'Telegram.ipa' -print -quit || true)
          if [ -z "$IPA_PATH" ]; then
            echo "ERROR: IPA not found. Listing bazel-out and recent logs for diagnosis."
            ls -la bazel-out || true
            echo "Showing last 200 lines of possible build log files (if any):"
            for f in $(find . -type f \( -name '*build*.log' -o -name '*make*.log' -o -name '*bazel*.log' \) -maxdepth 6 2>/dev/null); do
              echo "=== $f ==="
              tail -n 200 "$f" || true
            done
            exit 1
          fi
          echo "Found IPA: $IPA_PATH"
          cp "$IPA_PATH" build/artifacts/WewPagram.ipa
          ls -la build/artifacts

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: WewPagram-ipa
          path: upstream/build/artifacts/WewPagram.ipa
          retention-days: 14
