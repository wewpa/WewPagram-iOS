name: Build WewPagram

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 350

    steps:
      - name: Checkout mod patch (this repo)
        uses: actions/checkout@v4
        with:
          path: wewpagram-mod-source

      - name: Checkout upstream Telegram-iOS (with real submodules)
        run: |
          set -x
          git clone --recursive -j8 https://github.com/TelegramMessenger/Telegram-iOS.git upstream

      - name: Ensure submodules are initialized
        run: |
          set -x
          cd upstream
          git submodule sync --recursive
          git submodule update --init --recursive --jobs 8
          git submodule status --recursive

      - name: Apply WewPagram mod files
        run: |
          set -x
          # Не удаляем upstream файлы — rsync без --delete
          rsync -a --exclude='.git' wewpagram-mod-source/wewpagram-mod/ upstream/
          mkdir -p upstream/wewpagram-config
          cp wewpagram-mod-source/wewpagram-config/appstore-configuration.json upstream/wewpagram-config/

      - name: Show disk space
        run: df -h /

      - name: Select Xcode
        run: |
          set -x
          ls /Applications | grep -i xcode || true
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Import fake-codesigning certificates (if present)
        run: |
          set -x
          cd upstream
          if [ -f build-system/Make/ImportCertificates.py ]; then
            python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          else
            echo "NOTICE: build-system/Make/ImportCertificates.py not found — skipping certificate import."
          fi

      - name: Build WewPagram (capture logs)
        run: |
          set -x
          set -o pipefail
          cd upstream
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_wewpagram"
          export BAZEL_USER_ROOT
          BUILD_NUMBER="$(git -C . rev-list --count HEAD 2>/dev/null || echo 100001)"

          # Записываем stdout+stderr в build.log и сохраняем код возврата
          python3 -u build-system/Make/Make.py \
            --overrideXcodeVersion \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            build \
            --configurationPath="wewpagram-config/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER" 2>&1 | tee build.log
          BUILD_EXIT=${PIPESTATUS[0]:-1}

          # Если сборка провалилась — сохраняем логи в артефакты и выходим с тем же кодом
          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo "BUILD FAILED with exit code $BUILD_EXIT"
            mkdir -p build/artifacts/logs
            cp build.log build/artifacts/logs/ || true

            # Скопировать логи bazel/user если они доступны
            if [ -d "$BAZEL_USER_ROOT" ]; then
              echo "Copying bazel user root logs (partial)..."
              find "$BAZEL_USER_ROOT" -maxdepth 4 -type f -name '*.log' -print -exec cp --parents {} build/artifacts/logs/ \; || true
            fi

            # Список bazel-out для диагностики
            echo "Listing bazel-out top-level:"
            ls -la bazel-out || true

            # Вывести последние строки build.log для удобства (дублируется в артефактах)
            echo "==== last 200 lines of build.log ===="
            tail -n 200 build.log || true

            exit "$BUILD_EXIT"
          fi

      - name: Collect artifacts (IPA + logs)
        run: |
          set -x
          cd upstream
          mkdir -p build/artifacts

          # Найти любую .ipa (не только Telegram.ipa)
          IPA_PATH=$(find bazel-out -type f -name '*.ipa' -print -quit || true)
          if [ -z "$IPA_PATH" ]; then
            echo "ERROR: IPA not found after successful build. Listing bazel-out and tail of build.log:"
            ls -la bazel-out || true
            if [ -f build.log ]; then
              echo "==== last 300 lines of build.log ===="
              tail -n 300 build.log || true
              mkdir -p build/artifacts/logs
              cp build.log build/artifacts/logs/ || true
            fi
            # Также собрать любые другие логи, если они есть
            if [ -d "$BAZEL_USER_ROOT" ]; then
              find "$BAZEL_USER_ROOT" -maxdepth 4 -type f -name '*.log' -print -exec cp --parents {} build/artifacts/logs/ \; || true
            fi
            # Выход с ошибкой, чтобы CI показал падение и артефакты логов были доступны
            exit 1
          fi

          echo "Found IPA: $IPA_PATH"
          cp "$IPA_PATH" build/artifacts/WewPagram.ipa
          ls -la build/artifacts

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: WewPagram-ipa
          path: upstream/build/artifacts/WewPagram.ipa
          retention-days: 14

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            upstream/build/artifacts/logs/**
            upstream/build/artifacts/**
          retention-days: 14